apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier-app
  labels:
    app: frontend
    tier: presentation

spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: presentation
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation

    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: frontend
        image: rattisyam/three-tier-frontend:1.0.2
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE

        env:
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REACT_APP_API_URL

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3



---
apiVersion: v1
kind: Service
metadata:
  namespace: three-tier-app
  name: frontend-service
  labels:
    app: frontend
    tier: presentation
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 8090
    protocol: TCP
    name: http
  type: ClusterIP

  # For cloud providers (AWS/GCP/Azure), this will provision a load balancer
  # For local development (Minikube/Kind), use NodePort or port-forward instead
